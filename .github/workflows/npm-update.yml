name: npm update

# The reusable half of the weekly dependency batch. A consumer's own
# npm-update.yml is a few lines calling this via `uses:` — see README.md for
# the wiring example. Ported from gedmap's original per-repo copy; readmo and
# newshacker have since migrated too (see AGENTS.md "The extraction").
#
# `npm update` moves each dependency to the newest version ALLOWED BY THE
# RANGE ALREADY IN package.json, so a DIRECT dependency cannot cross a major:
# the publish job re-derives that from the diff and stops the run if one did.
# Majors stay a deliberate, human-initiated migration.
#
# Beneath package.json the promise is weaker. A subdependency whose own range
# is `*` or `>=x` can take a major without anything showing up in the
# package.json diff, and check-npm-update.mjs catches the ordinary shapes of
# that but is explicitly not exact — see its own comments for what it does
# and does not cover. Read "no majors" as guaranteed for what package.json
# declares, best-effort beneath it.

# The dispatch and PR-open steps below authenticate with the caller's
# ordinary `GITHUB_TOKEN` — no GitHub App installation token. On a repo
# where only allowlisted collaborators can trigger CI without approval,
# that can mean each week's run still needs a human to approve the
# dispatched checks before they execute, which is an acceptable interim
# state on the way to full automation, not the end state: swapping in an
# App-minted token for these steps (e.g. via
# actions/create-github-app-token) is the planned follow-up once one is
# set up, so the run stops needing that approval.

on:
  workflow_call:
    inputs:
      regenerate:
        description: >-
          Commands that rebuild a file derived from the dependency set (an
          import map kept in sync with the lockfile, say), one per line.
          They run after the check suite, reusing the real install the
          checks already did rather than installing a second time, in the
          same untrusted window. A failure stops the run: publishing a
          batch whose derived files are stale is the silent drift this
          input exists to end. Empty disables.
        type: string
        default: ''
      regenerated-files:
        description: >-
          Tracked files the regenerate commands rebuild, one per line,
          repo-relative. Committed alongside the manifests when they
          change, fingerprinted and verified the same way — the
          declaration is the boundary: only files named here may change
          during regeneration, and anything else the commands touch stops
          the run exactly as the tree check always has. Required when
          regenerate is set.
        type: string
        default: ''

# No permissions at the workflow level. The job that runs unreviewed
# dependency code gets a read-only token; only the publish job, which runs
# none, can write. The CALLER'S own workflow needs to grant the union of what
# both jobs below need (contents: write, pull-requests: write, actions:
# write) — a reusable workflow's own job-level permissions are honored but
# capped by what the caller allows, never widened past it.
permissions: {}

concurrency:
  group: npm-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Runs `npm update` and the checks. Third-party code executes here, so this
  # job holds no write token and cannot push anything.
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      base: ${{ steps.base.outputs.sha }}
      pkg_sha: ${{ steps.changed.outputs.pkg_sha }}
      lock_sha: ${{ steps.changed.outputs.lock_sha }}
      checks_sha: ${{ steps.checks.outputs.checks_sha }}
      deps_stat_sha: ${{ steps.checks.outputs.deps_stat_sha }}
      regen_sha: ${{ steps.regen.outputs.files_sha }}
      regen_mode: ${{ steps.regen.outputs.files_mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Always the default branch, never the dispatch ref. `workflow_dispatch`
          # exposes a Branch dropdown, and checkout would otherwise follow that
          # selection — so a manual run from a feature branch would base the
          # dependency branch on it and open a PR against the default branch
          # carrying that branch's commits as well as the update. The scheduled
          # path already defaults here; this makes both paths identical. (If the
          # expression is ever empty, checkout falls back to the default branch
          # anyway, so the failure mode is benign.)
          ref: ${{ github.event.repository.default_branch }}

          # `npm update` and every check below execute lifecycle scripts
          # (postinstall, prepare) from dependency versions nobody has reviewed
          # yet — inherent to testing an update. This job's token is read-only,
          # so the credential checkout would otherwise persist in .git/config
          # can't push; dropping it anyway keeps one less credential in reach of
          # code we haven't read, and keeps this correct if the permissions
          # block is ever widened.
          persist-credentials: false

      # Pinned and handed to the publish job. Publishing from "the default
      # branch" instead would take whatever the tip is by then — if someone
      # lands a package.json or lockfile commit in between, the artifact would
      # overlay dependency files resolved and tested against the older base and
      # silently revert it, while the PR body reported checks from that older
      # base.
      - name: Record the base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Read the major from .nvmrc rather than repeating it here, same
          # single-source rule the consumer's own ci.yml follows.
          node-version-file: .nvmrc
          cache: npm

      # `.nvmrc` holds a bare major and setup-node may serve a CACHED Node 24,
      # whose bundled npm can predate 11.10.0 — the release that added
      # `min-release-age`. Below that npm silently ignores .npmrc's cooldown
      # ("Unknown project config") and this job would resolve packages the repo
      # deliberately holds back, with no error anywhere. engines.npm is only
      # advisory without engine-strict, so declare-and-hope is not enough:
      # check what the runner actually has and raise it if short.
      - name: Ensure an npm that honors the .npmrc cooldown
        # zizmor: ignore[adhoc-packages] deliberate: raises the RUNNER'S own
        # npm to the floor .npmrc's min-release-age cooldown needs, derived
        # from engines.npm at run time rather than a version pinned here, so
        # this step stays correct as that floor moves. Not a dependency of
        # the project under test, and --ignore-scripts is already applied.
        run: |
          set -euo pipefail
          floor=$(node -p "require('./package.json').engines.npm.replace(/^>=/, '')")
          if [ "$(printf '%s\n%s\n' "$floor" "$(npm -v)" | sort -V | head -n1)" != "$floor" ]; then
            echo "npm $(npm -v) predates $floor, which .npmrc's cooldown needs; installing npm@$floor"
            # --ignore-scripts for the same reason as every other install
            # in this window: nothing unreviewed runs before the fingerprints.
            npm install -g --ignore-scripts "npm@$floor"
          fi
          npm -v

      # Truncating $GITHUB_PATH/$GITHUB_ENV is what keeps a lifecycle script's
      # reach inside the step that ran it: the runner applies those files to
      # LATER steps in the job, so a postinstall can otherwise put a fake `npm`
      # ahead of the real one for everything below. Emptying them here means the
      # runner applies nothing. It closes that channel — it does not make the
      # checks trustworthy in general (see check-npm-update.mjs's own comments),
      # since the same package code is loaded into the test process either way.
      - name: Install from the lockfile
        run: |
          set -euo pipefail
          # `--ignore-scripts` here too, and for the same reason the resolve
          # step below has it: this runs BEFORE the fingerprints exist, so a
          # postinstall from a package already in the lockfile could rewrite a
          # `resolved` URL or an `integrity` hash and have that rewrite be what
          # gets fingerprinted and published. Versions and majors would look
          # untouched, so neither the range check nor the major check would see
          # it. The real install, with scripts, is the first reported check —
          # after the manifests are pinned.
          npm ci --ignore-scripts
          : > "$GITHUB_PATH"
          : > "$GITHUB_ENV"

      # `--ignore-scripts` so the manifests are RESOLVED before any newly
      # selected package gets to run code. Without it, a postinstall from a
      # version this run just picked could rewrite package-lock.json during
      # this step and that rewrite would become the trusted snapshot — the
      # comparison after the checks would compare a poisoned file to itself.
      # The real install happens below, once there is something to snapshot.
      - name: Resolve updates within their declared ranges
        run: npm update --save --ignore-scripts

      - name: Stop early if nothing moved
        id: changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No dependency updates available this run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            # Captured now, while the change is still uncommitted. The clone is
            # shallow, so after committing there is no reliable second commit to
            # diff against.
            git diff --stat -- package.json > deps-stat.txt
            # Fingerprint now, before any check runs. The checks execute
            # dependency code, which could rewrite these files afterwards —
            # widening a range, repointing a lockfile `resolved` URL — and the
            # filename allowlist would wave it through as "expected".
            #
            # A step OUTPUT, not a file. A copy under /tmp would sit on the same
            # disk as the code it guards, owned by the same user, at a path
            # anything can guess — a lifecycle script could rewrite the manifest
            # and its snapshot together and the comparison would pass. The
            # runner captures $GITHUB_OUTPUT when this step ends and hands the
            # value to later steps and to the publish job; nothing that runs
            # afterwards can reach back and change it.
            echo "pkg_sha=$(sha256sum package.json | cut -d" " -f1)" >> "$GITHUB_OUTPUT"
            echo "lock_sha=$(sha256sum package-lock.json | cut -d" " -f1)" >> "$GITHUB_OUTPUT"
            # deps-stat.txt itself gets the SAME treatment below, one step
            # output at a time: the file above is a predictable, allowlisted
            # path (the tree-verification step has to accept it, since this
            # job writes it legitimately), so a lifecycle or build script
            # later in this job could overwrite it with arbitrary content
            # that then lands in the PR body unnoticed. Captured here too, so
            # the check-suite step below can rewrite the file from this
            # trusted copy once every check has finished running.
            {
              echo 'deps_stat<<DEPS_STAT_EOF'
              cat deps-stat.txt
              echo 'DEPS_STAT_EOF'
            } >> "$GITHUB_OUTPUT"
            git diff --stat -- package.json package-lock.json >> "$GITHUB_STEP_SUMMARY"
          fi

      # The PR this job opens is authored by GITHUB_TOKEN, and GitHub
      # deliberately does NOT trigger `on: pull_request` workflows for those —
      # it is the loop-prevention rule, and it has no per-repo opt-out short of
      # a PAT. So the consumer's own ci.yml will NOT run on the update PR: the
      # checks have to happen HERE or they do not happen at all, and a PR with
      # no red tick would read as verified when nothing had verified it.
      #
      # Every check runs even after one fails, so the PR body reports the whole
      # picture rather than only the first thing to break.
      - name: Run the full check suite
        if: steps.changed.outputs.changed == 'true'
        id: checks
        env:
          # Passed as an env var, not interpolated directly into the script
          # below via ${{ }} — the same template-injection shape as any other
          # untrusted-looking expression, even though this particular value
          # is trusted (captured before any dependency code ran). Safe habit,
          # cheap to keep.
          DEPS_STAT: ${{ steps.changed.outputs.deps_stat }}
        run: |
          set +e
          # Accumulated in a shell variable, not appended to checks.md as
          # each check finishes. checks.md is a predictable, allowlisted
          # path (the tree-verification step below has to accept it, since
          # this job writes it legitimately) — appending to it DURING the
          # loop would let a lifecycle or build script overwrite or extend
          # it with arbitrary content while later checks still trusted it,
          # and that content lands in the PR body unread. Keeping the report
          # in memory until every check has finished, then writing the file
          # ONCE below, means nothing dependency code does mid-loop can
          # survive into the file at all.
          report=""
          check() {
            echo "::group::$1"
            eval "$1"
            rc=$?
            echo '::endgroup::'
            if [ $rc -eq 0 ]; then
              report="${report}- ✅ \`$1\`"$'\n'
            else
              report="${report}- ❌ \`$1\` (exit $rc)"$'\n'
            fi
          }
          # The real install, with lifecycle scripts, so everything below runs
          # against the tree a consumer of this lockfile would get. It goes
          # THROUGH check() rather than in a step of its own: as a step, a
          # postinstall that fails would kill the job before the artifact
          # existed, and the whole batch would surface only as a red Actions run
          # nobody is looking at. As a check it lands in the body with the rest,
          # and the PR still opens saying which package broke.
          check 'npm ci'
          check 'npm run lint'
          check 'npm test'
          check 'npm run build'
          # Both report files written for the first time HERE, now that every
          # check has run — checks.md from the in-memory report above,
          # deps-stat.txt from the step output captured before any dependency
          # code ran. Either write clobbers whatever a lifecycle or build
          # script may have planted at these paths during the checks above.
          printf '%s' "$report" > checks.md
          # \n restored: the multiline GITHUB_OUTPUT capture that produced
          # $DEPS_STAT strips exactly the one trailing newline `git diff
          # --stat` always ends with (the value is the joined content
          # lines, with no newline after the last one). Losing it here would
          # put the PR body's closing ``` fence on the diffstat's last line
          # instead of its own, breaking the code block for everything after.
          printf '%s\n' "$DEPS_STAT" > deps-stat.txt
          # Both files just got their real, final content — fingerprint them
          # now, the same way pkg_sha/lock_sha were fingerprinted right after
          # the resolve step. Every check above ran dependency code in THIS
          # job; a lifecycle script's background process could still be
          # alive and rewrite either file on disk before upload-artifact
          # reads it. A step OUTPUT is out of that process's reach (it lives
          # in the runner's control plane, not the filesystem), and the
          # publish job — a fresh runner that never executes dependency code
          # — verifies the downloaded artifact against it below.
          echo "checks_sha=$(sha256sum checks.md | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "deps_stat_sha=$(sha256sum deps-stat.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          cat checks.md >> "$GITHUB_STEP_SUMMARY"
          # No pass/fail boolean written as this step's own OUTPUT — publish
          # derives that itself, from checks.md's own (fingerprint-verified)
          # content, rather than trusting a second, independently-forgeable
          # value from this same untrusted step. See AGENTS.md "Trust
          # model" and the "Derive the check verdict" step in publish.
          #
          # Every check above ran dependency code, so this step owes the same
          # containment as the installs: the verify step below invokes `git` and
          # `sha256sum`, and a planted pair on $GITHUB_PATH would let source
          # edits through the check whose entire job is catching them.
          : > "$GITHUB_PATH"
          : > "$GITHUB_ENV"

      # Rebuilds a file derived from the dependency set (readmo's import map
      # kept in sync with package-lock.json is the motivating case), one
      # command per line — the npm-update analog of gradle-update's
      # `regenerate` input. Runs after the checks, reusing the real install
      # they already did rather than installing a second time, in the SAME
      # untrusted window. A failure here is a STOP, unlike a failed check
      # above: publishing a batch whose derived files are stale is the
      # silent drift this input exists to end.
      - name: Regenerate derived files
        if: steps.changed.outputs.changed == 'true' && inputs.regenerate != ''
        id: regen
        env:
          REGENERATE: ${{ inputs.regenerate }}
          REGENERATED_FILES: ${{ inputs.regenerated-files }}
          # A declared path is consumer configuration, not something to
          # trust as a literal filename by default: `git ls-files` and
          # `git diff` below both read their pathspec argument for MAGIC
          # (":(top)**" matches every tracked file, not a file literally
          # named that) unless told not to — verified directly against a
          # real repo. Global for the step rather than per-invocation
          # since every git call here takes one of these paths.
          GIT_LITERAL_PATHSPECS: '1'
        run: |
          set -euo pipefail
          # The declaration is load-bearing — it is the commit allowlist —
          # so an empty one is a configuration error, not a default.
          files=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            files+=("$f")
          done <<< "$REGENERATED_FILES"
          if [ "${#files[@]}" -eq 0 ]; then
            echo '::error::regenerate is set but regenerated-files is empty — declare the files the commands rebuild.'
            exit 1
          fi
          # A duplicate survives the tree check below (both entries name the
          # same real change) but not the publish job's restore, which
          # extracts the artifact once per declared entry and removes each
          # source after copying it out — the second occurrence of the same
          # path would find nothing left to copy.
          dupes=$(printf '%s\n' "${files[@]}" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::regenerated-files lists the same path more than once:"
            echo "$dupes"
            exit 1
          fi
          for f in "${files[@]}"; do
            # Canonicalized so every later comparison — the tree check's
            # allowlist, the fingerprint lookups, the commit — is a plain
            # string match; a noncanonical spelling like ./x.json would be
            # declared and fingerprinted here but never match what git
            # status reports later, aborting every batch that actually
            # changes the file.
            canon=$(realpath -m --relative-to="$PWD" -- "$f")
            if [ "$canon" != "$f" ]; then
              echo "::error::regenerated-files entry '$f' is not in canonical repo-relative form; use '$canon'."
              exit 1
            fi
            case "$f" in
              package.json|package-lock.json|checks.md|deps-stat.txt|regen-handoff.tar|regen-stat.txt)
                echo "::error::regenerated-files must not name a file the workflow itself owns: $f"
                exit 1 ;;
              npm-update-hub|npm-update-hub/*)
                # The publish job's own checkout directory for the
                # canonical checker (see that job's "Check out the
                # canonical checker" step) — restoring a regenerated file
                # under this prefix would collide with it.
                echo "::error::regenerated-files must not name a path under npm-update-hub/ — that is the publish job's own checkout directory: $f"
                exit 1 ;;
            esac
            # Tracked files only: the publish job restores each one over a
            # checkout of the base, so a path with no base state has
            # nothing to be a regeneration OF — commit it by hand first.
            git ls-files --error-unmatch -- "$f" >/dev/null 2>&1 || {
              echo "::error::regenerated-files names a file git does not track: $f"
              exit 1
            }
          done
          # Before any regenerate command runs: the checks above already ran
          # unreviewed dependency code and could have left the tree dirty.
          # A regenerate command that resets its own working state first (an
          # ordinary "npm run build" doing something incidental) would
          # otherwise silently erase that evidence before the tree check at
          # the end of this job ever sees it, and a declared file the checks
          # modified would be fingerprinted and committed as though
          # regeneration produced it, when nothing here actually vouches for
          # it.
          # git status runs as its own bare assignment, not inside a longer
          # pipe ending in `|| true`, for the same reason the final tree
          # check further down does: a `|| true` on the end of a longer
          # pipe swallows a git-status failure exactly as readily as it
          # swallows grep's ordinary no-matches exit 1 (verified directly:
          # a corrupted .git produces an EMPTY $pretree with a zero exit
          # from the single-pipe form) — a corrupted git state read as
          # "nothing dirty" would let this pre-check silently pass instead
          # of catching exactly what it exists to catch.
          pretree_status=$(git status --porcelain --untracked-files=all)
          pretree=$(printf '%s\n' "$pretree_status" \
            | sed 's/^...//' \
            | grep -Ev '^(package\.json|package-lock\.json|checks\.md|deps-stat\.txt)$' || true)
          if [ -n "$pretree" ]; then
            echo '::error::The checks changed the tree outside the dependency manifests before regeneration ran. Not opening a PR — inspect these first:'
            echo "$pretree"
            exit 1
          fi
          # Fingerprinted before the regenerate commands run, verified
          # after: checks.md and deps-stat.txt already exist by now, but
          # nothing before this point stops a regenerate command — the same
          # dependency-adjacent code as the checks — from writing to them
          # too.
          reports_sha_before=$(sha256sum checks.md deps-stat.txt)
          # Same containment as the checks, but a failure here is a STOP,
          # not a flag: a batch whose derived files could not be rebuilt
          # would publish stale ones.
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            ( export GITHUB_OUTPUT=/dev/null GITHUB_ENV=/dev/null \
                GITHUB_PATH=/dev/null GITHUB_STEP_SUMMARY=/dev/null \
                GITHUB_STATE=/dev/null
              eval "$cmd" )
            echo '::endgroup::'
          done <<< "$REGENERATE"
          if [ "$(sha256sum checks.md deps-stat.txt)" != "$reports_sha_before" ]; then
            echo '::error::a regenerate command modified checks.md or deps-stat.txt — fix the regenerate input; these files belong to the workflow, not to a regeneration command.'
            exit 1
          fi
          # sha256sum's own "hash  path" lines, so the publish job can
          # verify the whole set with one `sha256sum -c`.
          {
            echo 'files_sha<<REGEN_SHA_EOF'
            sha256sum -- "${files[@]}"
            echo 'REGEN_SHA_EOF'
          } >> "$GITHUB_OUTPUT"
          # A content-only fingerprint has nothing to say about a chmod — a
          # regenerate command can flip a declared file's executable bit
          # without touching a byte of content. git's own two-state mode
          # (100644/100755, the only distinction it stores for a regular
          # file) is what a later `git add` will actually record, so that
          # is what gets fingerprinted and later verified.
          {
            echo 'files_mode<<REGEN_MODE_EOF'
            for f in "${files[@]}"; do
              if [ -x "$f" ]; then echo "100755 $f"; else echo "100644 $f"; fi
            done
            echo 'REGEN_MODE_EOF'
          } >> "$GITHUB_OUTPUT"
          git diff --stat -- "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
          # Dependency-adjacent code ran above; discard anything it queued
          # for later steps, same as every other step in this window.
          : > "$GITHUB_PATH"
          : > "$GITHUB_ENV"

      # The checks above and the commit below have to describe the SAME tree.
      # The commit stages package files by name (so a planted edit can't ride
      # along), but that cuts the other way too: a lifecycle script could edit
      # source or tests, let the suite pass on THAT tree, and have the edit
      # dropped at commit time — leaving the PR body reporting checks for a tree
      # nobody is merging. Since this PR never gets a normal `pull_request` CI
      # run, that report is all a reviewer has.
      #
      # Anything outside the dependency files is a stop, not something to strip
      # silently: a dependency that rewrites your source during install or test
      # is a decision for a human.
      - name: Verify only dependency files changed
        if: steps.changed.outputs.changed == 'true'
        env:
          # This job already runs dependency code by this point, so routing
          # these through env: isn't closing an injection this job's own
          # code couldn't already reach some other way — it's the same
          # zizmor-clean habit kept uniform across the whole workflow rather
          # than only where the blast radius differs.
          PKG_SHA: ${{ steps.changed.outputs.pkg_sha }}
          LOCK_SHA: ${{ steps.changed.outputs.lock_sha }}
          REGENERATED_FILES: ${{ inputs.regenerated-files }}
          # Empty unless the regenerate step ran and fingerprinted the
          # declared files — every regenerated-file exemption below keys
          # off THIS, never off the declaration alone: a `regenerate` input
          # that is set but produced nothing yet must not exempt anything.
          REGEN_SHA: ${{ steps.regen.outputs.files_sha }}
          REGEN_MODE: ${{ steps.regen.outputs.files_mode }}
        run: |
          set -euo pipefail

          # Regenerated files are the batch's own product when the
          # regenerate step ran — expected to differ from the fixed
          # allowlist below, vouched for by the fingerprint check further
          # down rather than by appearing in it.
          derived=()
          if [ -n "$REGEN_SHA" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              derived+=("$f")
            done <<< "$REGENERATED_FILES"
          fi

          # `git status`, not `git diff`: diff only sees TRACKED changes, so an
          # untracked file a lifecycle script drops into the tree — one that
          # tsc/vite/vitest would happily pick up — would sail past it while the
          # suite ran against it. Ignored paths (node_modules, dist, coverage)
          # are excluded by porcelain already; the two allowed extras are files
          # this job writes itself.
          #
          # git status writes to a TEMP FILE as its own bare command, not
          # captured inside a $()/pipe — `set -e` catches a bare command
          # that fails, but a blanket `|| true` on the end of a longer pipe
          # would swallow a git-status failure (a corrupted .git — a
          # malicious lifecycle script run earlier in this same job could
          # induce one, e.g. by removing .git/HEAD or .git/objects; a
          # merely-missing index doesn't reach this path, since git just
          # rebuilds one and git status still succeeds) exactly as readily
          # as it swallows grep's ordinary no-matches exit 1 — verified
          # against a repo with .git/HEAD removed ("fatal: not a git
          # repository", exit 128): a single-pipe form ending in `|| true`
          # produced an EMPTY $unexpected with a zero exit, i.e. a
          # corrupted git state read as "nothing unexpected," passing the
          # one check this step exists to enforce. A `< <(git status ...)`
          # process substitution would reopen the same hole in a subtler
          # form — its own exit status isn't checked by set -e or
          # pipefail — which is why this reads from a file `git status`
          # itself was made to write, rather than a live substitution.
          #
          # -z, not the default quoted/newline format: a regenerated-files
          # path is consumer data and can legitimately contain a space or
          # another character `core.quotePath` wraps in C-style quotes —
          # comparing that quoted status line against the raw declared path
          # would never match, wrongly aborting every batch whose declared
          # path needed quoting (verified directly: `git status
          # --porcelain` quotes a tracked "a file.json", `-z` does not).
          # And unlike a `tr '\0' '\n'` conversion, reading each NUL-
          # terminated record whole with `read -r -d ''` can't confuse an
          # embedded newline WITHIN an adversarial untracked filename for a
          # genuine record boundary — a tr-based split would let such a
          # filename masquerade as two separately-classified lines, one of
          # which could satisfy the allowlist and hide the other.
          #
          # mktemp, not a fixed name: dependency code ran in this same job
          # (npm update, the checks, any regenerate command) and could plant
          # a symlink at a predictable path in advance, so a later `>` here
          # would follow it and overwrite whatever it points at — verified
          # directly by pre-symlinking the old fixed name to checks.md and
          # watching the redirect truncate it. mktemp's own O_CREAT|O_EXCL
          # guarantees a fresh regular file at a name nothing could have
          # pre-placed a link at.
          status_z=$(mktemp "$RUNNER_TEMP/npm-update-status-XXXXXX.nul")
          git status --porcelain -z --untracked-files=all > "$status_z"
          unexpected=""
          while IFS= read -r -d '' entry; do
            path=${entry:3}
            case "$path" in
              package.json|package-lock.json|checks.md|deps-stat.txt)
                continue ;;
            esac
            # Checked against the regenerated-files declaration as whole
            # records too (a loop, not folded into the case above or a
            # grep pass): `grep`'s bare positional-argument form only
            # takes ONE pattern and treats any further arguments as FILE
            # names to search instead — confirmed directly (`grep -Fxv --
            # a b` errors "b: No such file or directory" rather than
            # excluding both) — so a `regenerated-files` declaration of
            # two or more paths would silently stop filtering after the
            # first. This loop has no such arity limit.
            keep=1
            for d in "${derived[@]}"; do
              if [ "$path" = "$d" ]; then
                keep=0
                break
              fi
            done
            [ "$keep" -eq 1 ] && unexpected="$unexpected$path"$'\n'
          done < "$status_z"
          rm -f -- "$status_z"
          unexpected=${unexpected%$'\n'}
          if [ -n "$unexpected" ]; then
            echo '::error::Dependency code touched files outside the dependency manifests. Not opening a PR — inspect these before trusting this batch:'
            echo "$unexpected"
            exit 1
          fi

          # IGNORED paths, as a SEPARATE pass — because the most dangerous plant
          # is precisely an ignored one, and the command above structurally
          # cannot see it. A gitignored file a build step LOADS (an env file, a
          # generated config) can inject values into the shipped output while
          # the tree still reads as clean.
          #
          # A separate pass rather than adding `--ignored` above, and that is
          # not a style choice: `--ignored` TOGETHER WITH `--untracked-files=all`
          # lists every ignored file individually, so the output becomes the
          # whole of node_modules — megabytes, and unusable. On its own,
          # `--ignored` collapses a fully-ignored directory to one entry
          # (`!! node_modules/`), which is what makes looking at ignored paths
          # affordable at all. Keep the two calls apart.
          #
          # The allowlist is build OUTPUTS. A repo whose build leaves other
          # ignored paths behind needs its own copy of this workflow until this
          # list becomes an input — see AGENTS.md "The extraction".
          #
          # Same reason as the git status call above: run bare, not inside
          # the pipe that ends in `|| true`, so a genuine git-status failure
          # trips `set -e` instead of being read as "no planted files."
          status_ignored=$(git status --porcelain --ignored)
          planted=$(printf '%s\n' "$status_ignored" \
            | grep '^!! ' \
            | sed 's/^!! //' \
            | grep -Ev '^(node_modules/|dist/|dist-ssr/|dev-dist/|coverage/|[^/]*\.tsbuildinfo)$' || true)
          if [ -n "$planted" ]; then
            echo '::error::Dependency code left IGNORED files in the tree. Git would not commit them, but the build could read them. Not opening a PR — inspect these:'
            echo "$planted"
            exit 1
          fi

          # Nothing may have touched the manifests since npm resolved them.
          # Compared against the fingerprints the resolve step recorded as step
          # outputs — values that live outside this filesystem, so unlike a
          # snapshot file they cannot be rewritten alongside what they guard.
          if [ "$(sha256sum package.json | cut -d" " -f1)" != "$PKG_SHA" ] \
             || [ "$(sha256sum package-lock.json | cut -d" " -f1)" != "$LOCK_SHA" ]; then
            echo '::error::A dependency file changed AFTER npm resolved it — something in the check run rewrote it. Not opening a PR.'
            exit 1
          fi

          # Nor the regenerated files since the regenerate step fingerprinted
          # them.
          if [ -n "$REGEN_SHA" ]; then
            printf '%s\n' "$REGEN_SHA" | sha256sum -c --strict --quiet \
              || { echo '::error::A regenerated file changed AFTER the regenerate step fingerprinted it — something in the check run rewrote it. Not opening a PR.'; exit 1; }
            # A content-only fingerprint has nothing to say about a chmod —
            # see the regenerate step's own comment on why the mode is
            # fingerprinted and verified separately.
            while IFS= read -r mode_line; do
              [ -z "$mode_line" ] && continue
              want_mode=${mode_line%% *}
              f=${mode_line#* }
              if [ -x "$f" ]; then have_mode=100755; else have_mode=100644; fi
              if [ "$have_mode" != "$want_mode" ]; then
                echo "::error::A regenerated file's executable bit changed AFTER the regenerate step fingerprinted it ($f: expected $want_mode, now $have_mode) — something in the check run rewrote it. Not opening a PR."
                exit 1
              fi
            done <<< "$REGEN_MODE"
          fi

          # The regenerated files travel as one tar under a fixed literal
          # name — upload-artifact reads its path list as glob patterns,
          # and a consumer's regenerated-files path is data that could
          # legitimately hold a glob metacharacter. NUL-delimited verbatim
          # names so no filename shape can smuggle options or split into
          # two. Always created, even when the feature is off, so the
          # artifact's fixed path list never goes missing.
          #
          # tar writes to an mktemp'd path and only the final `mv` touches
          # the fixed "regen-handoff.tar" name: dependency code already ran
          # in this job and knows that name from the workflow source, so it
          # could pre-plant a symlink there — same class as the status_z fix
          # above. `tar -cf regen-handoff.tar` directly would follow it and
          # overwrite whatever it points at; `mv` onto that path instead
          # replaces the directory entry via rename(2), which never
          # dereferences an existing destination (verified directly:
          # `mv`ing onto a pre-existing symlink leaves the link's target
          # file untouched and the destination path holding the new file).
          #
          # -T (--no-target-directory) is load-bearing, not cosmetic: a
          # symlink planted here pointing at a DIRECTORY instead of a file
          # (from a background process timed to land after the status scans
          # above but before this line — the same race the manifest
          # fingerprints already have to account for) makes a bare `mv`
          # move the tar INSIDE that directory rather than replace the
          # symlink, leaving regen-handoff.tar still attacker-controlled —
          # verified directly. -T forces "dest is a file," so `mv` always
          # replaces the entry regardless of what it resolves to.
          regen_tmp=$(mktemp "$RUNNER_TEMP/npm-update-regen-handoff-XXXXXX.tar")
          if [ "${#derived[@]}" -gt 0 ]; then
            printf '%s\0' "${derived[@]}" | tar -cf "$regen_tmp" --null --verbatim-files-from -T -
          else
            tar -cf "$regen_tmp" -T /dev/null
          fi
          mv -T -- "$regen_tmp" regen-handoff.tar

          # The manifest CONTENT check does not live here — see the publish
          # job's "Re-validate the dependency diff from a clean context". This
          # job has run the updated packages' own code, so an assertion made
          # here about what the manifests CONTAIN is only as honest as the
          # batch. The two checks above still earn their place: a fingerprint
          # recorded as a step output is out of reach even here, and the tree
          # check catches a lifecycle script touching the working tree, which is
          # what a non-adversarial failure actually looks like.

      # Hand the result to the publish job as data. The install steps truncate
      # $GITHUB_PATH/$GITHUB_ENV so a planted `git` or `gh` cannot reach a later
      # step, but that is a patch on one channel: GitHub-hosted runners give the
      # job passwordless sudo, so nothing done inside this job is equivalent to
      # holding the token on a runner where none of this code ever ran.
      - name: Hand off the dependency diff
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-update
          path: |
            package.json
            package-lock.json
            checks.md
            deps-stat.txt
            regen-handoff.tar
          retention-days: 1
          if-no-files-found: error

  # Publishes. Runs on a fresh runner, installs nothing, and executes no
  # dependency code — so the write token is never in a machine where an
  # unreviewed package has run.
  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Dispatching `ci.yml` on the pushed branch is a write to the Actions API.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact commit the update job tested, not the branch tip.
          ref: ${{ needs.update.outputs.base }}
          persist-credentials: false

      # The canonical checker, from THIS repository rather than the consumer's
      # own tree — that is the point of the extraction: one copy instead of a
      # hand-synced one per consumer. Pinned to `job.workflow_sha` — the exact
      # commit of THIS reusable workflow as it was resolved when the caller
      # invoked it (added to the job context 2026-04-23) — rather than a
      # second, independent `ref: main` lookup. A plain `main` here is a
      # different resolution from the one that already picked which revision
      # of npm-update.yml itself is running: `main` can advance between those
      # two moments, pairing an older workflow revision with a newer checker
      # (or the reverse), and a consumer piloting this workflow from a branch
      # per AGENTS.md "Piloting happens BEFORE the merge" would still get
      # `main`'s checker instead of the branch's — silently testing the wrong
      # thing. `job.workflow_sha` is the same commit either way, so the
      # workflow and the checker it loads are always the one pair that was
      # actually reviewed and tested together.
      - name: Check out the canonical checker
        uses: actions/checkout@v7
        with:
          repository: mikelward/npm-update
          ref: ${{ job.workflow_sha }}
          path: npm-update-hub
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: npm-update

      # The artifact traveled through a machine that ran dependency code, so
      # check it against the fingerprints taken before any of it ran. Those
      # came across as job outputs, which live in the runner's control plane
      # rather than on that machine's disk.
      - name: Check the artifact against the pre-check fingerprints
        env:
          # These four fingerprints are job outputs from `update`, a job that
          # runs `npm update` and therefore executes arbitrary dependency
          # lifecycle code. `${{ }}` substitution happens at the workflow-parse
          # level, before the shell ever runs — splicing an untrusted output
          # straight into the script text (as this step used to) means a
          # value containing a quote is script injection with this job's
          # write-scoped token, not just a comparison that happens to fail.
          # Routed through env: so they only ever reach the shell as inert
          # data via a variable expansion.
          PKG_SHA: ${{ needs.update.outputs.pkg_sha }}
          LOCK_SHA: ${{ needs.update.outputs.lock_sha }}
          CHECKS_SHA: ${{ needs.update.outputs.checks_sha }}
          DEPS_STAT_SHA: ${{ needs.update.outputs.deps_stat_sha }}
        run: |
          set -euo pipefail
          [ "$(sha256sum package.json | cut -d" " -f1)" = "$PKG_SHA" ] \
            || { echo '::error::package.json does not match what the update job resolved.'; exit 1; }
          [ "$(sha256sum package-lock.json | cut -d" " -f1)" = "$LOCK_SHA" ] \
            || { echo '::error::package-lock.json does not match what the update job resolved.'; exit 1; }
          # checks.md and deps-stat.txt get the same treatment: both are
          # written into the PR body below, unread, and both crossed through
          # the same machine that ran dependency code before reaching this
          # artifact — a background process there could have rewritten
          # either after the update job's own fingerprinting step ran and
          # before upload-artifact captured them.
          [ "$(sha256sum checks.md | cut -d" " -f1)" = "$CHECKS_SHA" ] \
            || { echo '::error::checks.md does not match what the update job wrote.'; exit 1; }
          [ "$(sha256sum deps-stat.txt | cut -d" " -f1)" = "$DEPS_STAT_SHA" ] \
            || { echo '::error::deps-stat.txt does not match what the update job wrote.'; exit 1; }

      # regen-handoff.tar travels through the same machine that ran
      # dependency code, so nothing in it is trusted by name: it is
      # unpacked OUTSIDE the checkout, only the paths regenerated-files
      # declares are copied out of it, and each copy must match the
      # fingerprint the regenerate step took before any review code ran. A
      # no-op when regenerate is disabled (files_sha is then empty) — the
      # tar still exists (always created by the update job) but is empty.
      - name: Restore and verify regenerated files
        env:
          REGENERATED_FILES: ${{ inputs.regenerated-files }}
          REGEN_SHA: ${{ needs.update.outputs.regen_sha }}
          REGEN_MODE: ${{ needs.update.outputs.regen_mode }}
        run: |
          set -euo pipefail
          [ -n "$REGEN_SHA" ] || exit 0
          files=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            files+=("$f")
          done <<< "$REGENERATED_FILES"
          mkdir -- "$RUNNER_TEMP/regenerated"
          tar -xf regen-handoff.tar -C "$RUNNER_TEMP/regenerated"
          for f in "${files[@]}"; do
            [ -f "$RUNNER_TEMP/regenerated/$f" ] \
              || { echo "::error::The artifact is missing declared regenerated file: $f"; exit 1; }
            # `-L`, not `-f`: a symlink to a regular file passes `-f` (it
            # dereferences), which is exactly the shape that would slip
            # past this check and into the `cp` below. A regenerated file
            # is always meant to be a plain file.
            if [ -L "$RUNNER_TEMP/regenerated/$f" ]; then
              echo "::error::regenerated-files artifact carries a symlink, not a regular file: $f"
              exit 1
            fi
            # Remove the destination first: if the base checkout holds $f
            # as a symlink, `cp` without this would follow it and write
            # the verified bytes through to whatever it points at, leaving
            # the symlink itself unchanged — the fingerprint check below
            # would then pass by reading through the same symlink, and
            # `git add` later would stage no change at all.
            rm -f -- "$f"
            cp -- "$RUNNER_TEMP/regenerated/$f" "$f"
            rm -- "$RUNNER_TEMP/regenerated/$f"
          done
          leftover=$(find "$RUNNER_TEMP/regenerated" -type f -o -type l | head -n 1)
          if [ -n "$leftover" ]; then
            echo "::error::The regenerated-files artifact carried an undeclared file: $leftover"
            exit 1
          fi
          rm -rf -- "$RUNNER_TEMP/regenerated"
          printf '%s\n' "$REGEN_SHA" | sha256sum -c --strict --quiet \
            || { echo '::error::A regenerated file does not match what the update job fingerprinted.'; exit 1; }
          # Same reasoning as the update job's own re-check: content can
          # match while the executable bit doesn't.
          while IFS= read -r mode_line; do
            [ -z "$mode_line" ] && continue
            want_mode=${mode_line%% *}
            f=${mode_line#* }
            if [ -x "$f" ]; then have_mode=100755; else have_mode=100644; fi
            if [ "$have_mode" != "$want_mode" ]; then
              echo "::error::A regenerated file's executable bit does not match what the update job fingerprinted ($f: expected $want_mode, got $have_mode)."
              exit 1
            fi
          done <<< "$REGEN_MODE"
          # Taken now, while the tree still diffs against the base — after
          # the commit below there is nothing left to diff.
          git diff --stat -- "${files[@]}" > regen-stat.txt

      # See AGENTS.md "Trust model": update no longer reports its own
      # pass/fail verdict as a job output. That boolean and checks.md's
      # content were both produced inside the same untrusted step that runs
      # `npm update` — a sufficiently sophisticated lifecycle script's
      # background process could in principle forge the two together before
      # the step's shell exits, so trusting the boolean added a SECOND,
      # independently-forgeable signal on top of the file the fingerprint
      # check above already verifies. Deriving the verdict from checks.md's
      # own (now fingerprint-verified) content instead collapses that to one
      # signal: there is exactly one place a false "all checks passed" can
      # come from, and it's the file this job just checked. Not a complete
      # fix — a forger sophisticated enough to fake checks.md's content
      # consistently with its own fingerprint isn't caught by this either,
      # and neither is deps-stat.txt's content, which stays purely
      # informational — but it removes the redundant, separately-forgeable
      # boolean this workflow used to trust for the auto-merge gate and the
      # PR title.
      #
      # Fails closed: an empty file, a line that doesn't match the exact
      # format check() writes, a check identity this workflow doesn't run,
      # or any of the four expected checks appearing zero or more than once
      # are all treated as failed, never silently passed. Neither "at least
      # one recognized ✅ line" nor "exactly four canonical-looking lines"
      # is enough on its own — a malformed report could satisfy either while
      # substituting or duplicating a successful record in place of a real
      # one (four copies of "- ✅ `npm ci`" passes a bare count check).
      - name: Derive the check verdict from checks.md, not the untrusted job's own report
        id: verdict
        run: |
          set -euo pipefail
          if [ ! -s checks.md ]; then
            echo '::error::checks.md is empty — cannot verify checks.'
            echo 'passed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The exact commands check() runs above, not just a count. A named
          # list rather than re-derived from the check '...' calls: if that
          # list ever changes without this being updated too, an
          # unrecognized identity below fails closed (a clear, if noisy,
          # error) rather than silently accepting a report that doesn't
          # match what actually ran.
          EXPECTED_CHECKS=('npm ci' 'npm run lint' 'npm test' 'npm run build')
          declare -A seen_count
          for c in "${EXPECTED_CHECKS[@]}"; do seen_count["$c"]=0; done
          failed=0
          # `|| [ -n "$line" ]` picks up a final line with no trailing
          # newline — checks.md as this workflow writes it always ends in
          # one, but a malformed or forged file might not, and without this
          # a plain `while read` silently drops (and never validates) that
          # last line. Verified directly before writing this.
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            if [[ "$line" =~ ^-\ ❌\ \`([^\`]+)\`\ \(exit\ [0-9]+\)$ ]]; then
              cmd="${BASH_REMATCH[1]}"
              is_failed=1
            elif [[ "$line" =~ ^-\ ✅\ \`([^\`]+)\`$ ]]; then
              cmd="${BASH_REMATCH[1]}"
              is_failed=0
            else
              echo "::error::checks.md has a line that doesn't match the canonical check format — treating as failed rather than guessing: $line"
              echo 'passed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "${seen_count[$cmd]+set}" ]; then
              echo "::error::checks.md reports a check this workflow doesn't run — treating as failed rather than guessing: $cmd"
              echo 'passed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            seen_count["$cmd"]=$((seen_count["$cmd"] + 1))
            [ "$is_failed" -eq 1 ] && failed=1
          done < checks.md
          for c in "${EXPECTED_CHECKS[@]}"; do
            if [ "${seen_count[$c]}" -ne 1 ]; then
              echo "::error::checks.md reports '$c' ${seen_count[$c]} time(s), expected exactly 1 — treating as failed rather than guessing."
              echo 'passed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo 'passed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'passed=true' >> "$GITHUB_OUTPUT"
          fi

      # The authoritative check on what this commit contains, and the reason
      # it lives HERE: everything the update job asserted about the manifests,
      # it asserted on a machine where the updated packages' own code had
      # already run. This job installs nothing and executes no dependency code,
      # so `git show HEAD:...` and the downloaded artifact are both out of the
      # batch's reach.
      - name: Re-validate the dependency diff from a clean context
        run: node npm-update-hub/check-npm-update.mjs

      # Names every package the batch moved, for the PR body. Same clean
      # context as the validation above — and it must stay BEFORE the publish
      # step's commit: the summary diffs the working tree against HEAD exactly
      # as the validator does, so after the commit it would read "no changes".
      - name: Name the updated packages for the PR body
        run: node npm-update-hub/check-npm-update.mjs summary > deps-summary.md

      - name: Stop if the default branch moved while the checks ran
        env:
          GH_TOKEN: ${{ github.token }}
          # Another `update`-job output — same injection concern as the
          # fingerprint step above, routed through env: for the same reason.
          EXPECTED_BASE: ${{ needs.update.outputs.base }}
          # default_branch isn't PR-influenced, but zizmor flags any `${{ }}`
          # spliced into a run: script regardless of trust level, and this
          # workflow already routes trusted values through env: elsewhere
          # for exactly that reason (see DEPS_STAT above) — same habit,
          # cheap to keep.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="$DEFAULT_BRANCH"
          current=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$branch" --jq .sha)
          if [ "$current" != "$EXPECTED_BASE" ]; then
            echo "::error::$branch moved from $EXPECTED_BASE to $current while the checks ran, so the verified manifests and the branch they would land on no longer match. Re-run the workflow."
            exit 1
          fi

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          # From THIS job's own "Derive the check verdict" step, not a
          # `needs.update.outputs.*` value — see AGENTS.md "Trust model".
          # `passed` also drives the auto-merge decision later in this same
          # step, so it gets an explicit allowlist check on top: anything
          # other than the literal strings "true" or "false" fails the job
          # rather than being treated as one or the other by accident.
          PASSED: ${{ steps.verdict.outputs.passed }}
          # Not PR-influenced, but a spliced ${{ }} breaks on a branch name
          # containing an apostrophe (a valid git ref, e.g. feature/o'hare)
          # by ending the shell's single-quoted string early — a real
          # correctness bug, not just an injection-style habit. env: avoids
          # both.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Purely numeric run identifiers, but routed the same way for the
          # same "safe habit, cheap to keep" reason as everything else in
          # this file — caught by yaml-lite's structural sweep, which
          # doesn't special-case any splice as "probably fine".
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REGENERATED_FILES: ${{ inputs.regenerated-files }}
          # Empty unless the update job's regenerate step actually ran and
          # fingerprinted the declared files — drives the title/verdict
          # branch and withholds auto-merge below. See AGENTS.md "Trust
          # model".
          REGEN_SHA: ${{ needs.update.outputs.regen_sha }}
          # See the regenerate step's own comment: `git add -- "$f"` below
          # reads $f as a pathspec, and pathspec magic in a declared path
          # would otherwise stage more than the one file it names.
          GIT_LITERAL_PATHSPECS: '1'
        run: |
          set -euo pipefail
          case "$PASSED" in
            true|false) ;;
            *) echo "::error::unexpected 'passed' output: $PASSED"; exit 1 ;;
          esac

          # Keyed on the RUN DATE, not the month. The job runs weekly, so a
          # month-scoped name would collide with the previous Saturday's branch
          # and every run but the first would fall into the run-scoped fallback
          # below — which works, but that fallback is for a re-run of the same
          # batch, not for a distinct scheduled one.
          today=$(date -u +%Y-%m-%d)
          branch="deps/update-$today"

          if [ "$PASSED" != 'true' ]; then
            title="deps: Update dependencies ($today) — CHECKS FAILING"
            verdict='**One or more checks failed.** Do not merge until they are fixed — the failures are real, not flakes to route around.'
          elif [ -n "$REGEN_SHA" ]; then
            # See AGENTS.md "Trust model": unlike the manifests, a
            # regenerated file's content is never independently re-derived
            # in a clean context here — publish only re-verifies the
            # fingerprint the untrusted update job itself took, the same
            # residual gap checks.md/deps-stat.txt already carry. Auto-
            # merge is withheld so a human looks at the regenerated diff
            # before it lands, even though the ordinary checks passed.
            title="deps: Update dependencies ($today) — REGENERATED FILES, REVIEW BEFORE MERGE"
            verdict='All checks passed, but this batch also regenerated a derived file (see AGENTS.md "Trust model") — that content is not independently re-derived the way the manifests are, so auto-merge is deliberately not armed. Review the regenerated diff below before merging by hand.'
          else
            title="deps: Update dependencies ($today)"
            verdict='All checks passed in the job that produced this branch.'
          fi

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Never force-push. The PR body tells reviewers to push fixes to this
          # branch — which is also how CI starts running on it — so a re-run on
          # the same day would otherwise overwrite work this job did not
          # create. If today's branch already exists, take a run-scoped one
          # and open its own PR instead of clobbering. run_attempt, not just
          # run_number: a re-run of the SAME run keeps the same run_number, so
          # a run retried more than once (this fallback already claimed once)
          # would otherwise pick the identical fallback name a second time and
          # the non-force push would be rejected. run_attempt increments on
          # every retry, so the pair is unique across retries of one run too.
          # --exit-code's documented contract (git ls-remote -h) is exit 2
          # for "no matching ref" — the ordinary, expected case here — and
          # exit 0 when the branch exists. Any OTHER nonzero (128 on a real
          # auth/network failure, verified against an actual bad-token
          # request) means this lookup couldn't answer the question at all,
          # not that the branch is absent; treating it as "absent" would
          # keep the primary name and let the non-force push below fail
          # blind on a branch that may genuinely already exist, or paper
          # over a connectivity problem the push and PR-open calls just
          # below depend on too. rc=$? right after `|| rc=$?`, not a
          # separate statement, so set -e doesn't kill the script before
          # the code is captured.
          ls_remote_rc=0
          git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null 2>&1 || ls_remote_rc=$?
          if [ "$ls_remote_rc" -eq 0 ]; then
            branch="$branch-run${RUN_NUMBER}-${RUN_ATTEMPT}"
            echo "Today's branch already exists; using $branch instead." \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ls_remote_rc" -ne 2 ]; then
            echo "::error::Could not check whether $branch already exists on the remote (git ls-remote exited $ls_remote_rc, expected 0 or 2) — stopping rather than guessing."
            exit 1
          fi

          # Belt and braces. This runner is fresh and nothing has run on it, so
          # there is no hook to plant — but the cost of keeping this is zero and
          # it stays correct if the job ever gains a step.
          git config --global core.hooksPath /dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          # Stage by name. The artifact only carries these files, but naming them
          # keeps that true even if it ever carries more.
          git add -- package.json package-lock.json
          if [ -n "$REGENERATED_FILES" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              git add -- "$f"
            done <<< "$REGENERATED_FILES"
          fi
          git commit -q -m "$title"
          git push "$remote" "HEAD:refs/heads/$branch"

          # A PR opened by `GITHUB_TOKEN` does not trigger `on: pull_request`
          # workflows — GitHub's loop-prevention rule, with no per-repo opt-out
          # short of a PAT — so nothing would start CI on this branch, and a PR
          # with no red tick reads as verified when nothing verified it.
          # `workflow_dispatch` is the documented EXCEPTION to that rule: a
          # dispatch made with `GITHUB_TOKEN` *does* create a run. So ask for one
          # explicitly against the branch just pushed. Its check runs land on the
          # branch head, which becomes this PR's head, so they appear on the PR
          # like any other. This needs the consumer's `ci.yml` to carry
          # `workflow_dispatch` ON THE DEFAULT BRANCH — a workflow GitHub cannot
          # see there is not dispatchable, however the branch under test spells
          # it.
          #
          # Dispatched HERE, before the body is composed, so the body can state
          # what actually happened. Reporting a failure only into the run summary
          # would leave the PR itself promising a CI run that is never coming —
          # which is exactly the "no checks means it passed" reading this whole
          # thing exists to prevent, and the assignee reads the PR, not the run
          # log.
          #
          # Non-fatal either way: the branch is pushed by this point and the job
          # has already run every check itself, so a failed dispatch must not
          # turn a pushed branch into no PR.
          # The PR is created BEFORE the dispatch, with a placeholder body,
          # because the dispatch must name the pull request it reports for:
          # a docs-lane gate refuses an anonymous branch dispatch, which is
          # what keeps a dispatched verdict from labeling a commit some other
          # pull request heads. The real body lands right after the dispatch
          # (still composed after it, so it can state what actually happened
          # — the assignee reads the PR, not the run log).
          # Scoped to THIS repository's own branch: `gh pr list --head` filters
          # by bare branch name, which can also match a fork's PR of the same
          # name; the REST head= filter names the owner, so only the branch
          # just pushed here can answer.
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${branch}&state=open" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr_url=$(gh pr create --title "$title" \
              --body 'Opening — the checks report lands in a moment.' \
              --base "$DEFAULT_BRANCH" --head "$branch")
            pr=${pr_url##*/}
          fi

          if gh workflow run ci.yml --ref "$branch" -f pr="$pr"; then
            ci_started=true
          else
            ci_started=false
            echo "Could not start CI on $branch; the PR body says so." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          # The consumer check needs the same treatment for the same reason,
          # and it is the one that would silently never report: `ci.yml` at
          # least has this dispatch, while codex-review-check.yml's own
          # triggers are `push` and `pull_request_target`, both suppressed for
          # a GITHUB_TOKEN-authored pull request, and it has no schedule to
          # fall back on the way the codex sweep does. So once the ruleset
          # requires it, a batch without this dispatch would block forever.
          # Its `workflow_dispatch` trigger exists for exactly this call.
          if gh workflow run codex-review-check.yml --ref "$branch"; then
            check_started=true
          else
            check_started=false
            echo "Could not start codex-review-check on $branch; the PR body says so." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "\`npm update --save\` — every dependency moved to the newest version its"
            echo 'existing range in `package.json` allows. **No majors**: those need a'
            echo 'deliberate migration and this job cannot produce one.'
            echo
            echo '## Checks'
            echo
            cat checks.md
            echo
            echo "$verdict"
            echo
            if [ "$ci_started" = true ]; then
              echo '> These ran in the workflow job, not on this PR. A PR opened by'
              echo '> `GITHUB_TOKEN` does not trigger `on: pull_request` workflows, so CI'
              echo '> does not start here on its own — this job dispatched `ci.yml` against'
              echo '> the branch instead, and that run reports on this PR like any other.'
            else
              echo '> **CI could not be started on this branch, so the checks above are the'
              echo '> only ones that ran.** A PR opened by `GITHUB_TOKEN` does not trigger'
              echo '> `on: pull_request` workflows and the explicit dispatch failed, so'
              echo '> nothing else will start it. Push any commit to the branch and CI runs'
              echo '> normally from then on.'
            fi
            # Reported outside the branch above, so a failed CI dispatch cannot
            # hide a failed check dispatch -- they are separate workflows and
            # either can fail alone.
            if [ "$check_started" != true ]; then
              echo
              echo '> **`codex-review-check` could not be dispatched**, so the workflow pin'
              echo '> is unverified on this PR. It cannot start on its own here either, for'
              echo '> the same reason CI cannot. Push any commit to the branch, or re-run'
              echo '> that workflow against it by hand.'
            fi
            echo
            # Which packages moved, direct vs transitive, with ranges and
            # versions -- generated by the summary step above, in the clean
            # context, before anything here committed.
            cat deps-summary.md
            echo
            echo '<details><summary>package.json diffstat</summary>'
            echo
            echo '```'
            cat deps-stat.txt
            echo '```'
            echo
            echo '</details>'
            echo
            if [ -s regen-stat.txt ]; then
              echo '<details><summary>Regenerated files diffstat</summary>'
              echo
              echo '```'
              cat regen-stat.txt
              echo '```'
              echo
              echo '</details>'
              echo
            fi
            echo 'Review the direct moves above for anything surprising; the lockfile'
            echo 'churn underneath them is expected and not worth reading line by line.'
            echo
            echo '---'
            echo '_Opened by the weekly `npm-update` workflow._'
          } > body.md

          # `gh pr edit` failing here (a transient API error) must not strand
          # the PR on its placeholder body under `set -e` — the assignment
          # and review request below still have to run, because the assignee
          # is how an unattended PR gets seen. Retry, then downgrade to a
          # loud note: a placeholder body with a red warning beats no
          # assignee at all.
          edited=false
          for _ in 1 2 3; do
            if gh pr edit "$pr" --title "$title" --body-file body.md; then
              edited=true
              break
            fi
            sleep 5
          done
          if [ "$edited" != true ]; then
            echo "::warning::Could not publish the PR body for #$pr; it still carries the placeholder."
            echo "PR body update failed for #$pr — placeholder body remains." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Put it in front of a human. Without this the PR only exists in the
          # repo's PR list, which is precisely where a weekly unattended job
          # goes unnoticed — and an unreviewed dependency PR sitting open is the
          # failure this whole design is trying to avoid.
          #
          # The owner comes from the runner's own $GITHUB_REPOSITORY_OWNER
          # (already used above for the same reason) rather than a
          # hard-coded handle, so this file stays identical across every
          # consumer and does not go stale if the account is ever renamed —
          # and never spliced from an expression, which breaks the same way
          # a spliced branch name would on an owner login containing a
          # shell-special character. (This comment avoids writing the
          # literal double-brace expression syntax here on purpose: unlike
          # a comment above an env: key, this line is INSIDE the run: block's
          # own string value, and GitHub's expression substitution scans
          # that whole string before bash ever sees it — an empty pair of
          # braces here is a real, if unlikely, way to break every
          # consumer's run.)
          #
          # Deliberately non-fatal. A review request can be refused for reasons
          # that have nothing to do with this batch — the requestee must be a
          # collaborator, and GitHub silently drops a request when the requestee
          # is the PR's own author — and the branch is already pushed by this
          # point. An opened-but-unassigned PR is recoverable; a failed step
          # that leaves a pushed branch with no PR is not.
          reviewer="$GITHUB_REPOSITORY_OWNER"
          if ! gh pr edit "$pr" --add-assignee "$reviewer" --add-reviewer "$reviewer"; then
            echo "Could not assign or request review from @$reviewer — the PR is open and needs a look." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          # Arm auto-merge, so a clean batch lands with no human in the loop —
          # but only when the producer job's own checks passed. The merge
          # gate's required checks (ci, codex, and anything else the ruleset
          # names) run against the PR HEAD, which is a fresh dispatch — they
          # do not necessarily repeat every command the producer job ran
          # (a consumer's ci.yml is free to run a different check set), so a
          # producer failure is not guaranteed to also fail a required check.
          # Without this gate, "CHECKS FAILING" in the title could still
          # merge on a clean ci/codex run that never re-ran the failing
          # command. Non-fatal for the same reason as the review request
          # above: the PR already exists, and repos without auto-merge
          # allowed just fall back to manual — and on a failing batch, that
          # fallback (no auto-merge armed) is the correct outcome anyway.
          #
          # Also withheld when this batch regenerated a derived file (see
          # AGENTS.md "Trust model" and the title/verdict branch above):
          # unlike the manifests, a regenerated file's content is only
          # fingerprint-checked here, never independently re-derived, so
          # untrusted update-job code could otherwise determine what
          # auto-merges through a regenerated file even while every
          # ordinary check passes.
          if [ "$PASSED" = 'true' ] && [ -z "$REGEN_SHA" ]; then
            if ! gh pr merge --auto --rebase "$pr"; then
              echo "Could not arm auto-merge — the PR is open and waits for a manual merge." \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
